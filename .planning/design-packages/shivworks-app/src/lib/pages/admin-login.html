<div class="login-wrap">
    <div class="login-brand">
      <img src="assets/cobra-logo.png" alt="ShivWorks Network" />
      <span class="lb-name">The ShivWorks Network</span>
    </div>
    <form class="panel login-card" id="login-form" data-endpoint="POST /api/admin/session">
      <span class="login-tag"><svg><use href="#i-shield"></use></svg> Staff access</span>
      <h1>Admin sign-in</h1>
      <p class="sub">Enter your staff credentials to open the admin console. Members don't have access to this area.</p>

      <div class="fld"><label>Name</label><input id="login-name" type="text" placeholder="Craig Douglas" value="Craig Douglas" /></div>
      <div class="fld"><label>Staff email</label><input id="login-email" type="email" placeholder="you@shivworks.com" value="craig@shivworks.com" /></div>
      <div class="fld"><label>Access key</label><input id="login-key" type="password" placeholder="••••••••" value="shivworks" /></div>

      <button class="btn btn-primary" type="submit"><svg><use href="#i-shield"></use></svg> Enter admin console</button>

      <div class="login-demo">
        <p>Prototype — any credentials grant access for the demo. Admin state is remembered on this browser.</p>
      </div>
    </form>
    <div class="login-foot"><a href="dashboard.html">← Back to the member app</a></div>
  </div>

  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">

  </svg>
